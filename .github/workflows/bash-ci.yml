on:
  push:
    branches:
      - main
    paths:
      - '**.sh'
  pull_request:
    branches:
      - main
    paths:
      - '**.sh'

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Shellcheck on *.sh
        run: |
          set -euo pipefail
          mapfile -t sh_files < <(git ls-files '*.sh')
          if [ ${#sh_files[@]} -eq 0 ]; then
            echo "No shell scripts to check"
            exit 0
          fi
          echo "Shell scripts: ${sh_files[*]}"
          shellcheck --version
          shellcheck --severity=warning --format=gcc "${sh_files[@]}"
