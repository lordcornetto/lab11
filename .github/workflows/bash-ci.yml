name: Bash Script CI

on:
  push:
    branches:
      - main
    paths:
      - '**.sh'
  pull_request:
    branches:
      - main
    paths:
      - '**.sh'

permissions:
  contents: read

jobs:
  ci-bash:
    name: ci-bash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Shellcheck on *.sh
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck
